<div class="min-h-screen bg-ink-50 flex flex-col justify-center px-6 py-12">
  <div class="w-full max-w-[400px] mx-auto">
    <div class="mb-10 flex justify-center">
      <app-logo [heightPx]="56" />
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-ink-100 p-8">
      <h1 class="text-xl font-bold text-ink-700 mb-1">Acceso de ingenieros</h1>
      <p class="text-sm text-ink-300 mb-8">Ingresa tus credenciales para continuar</p>

      <form (ngSubmit)="submit()" class="flex flex-col gap-5">
        <div>
          <label class="block text-xs font-semibold text-ink-400 uppercase tracking-wider mb-2">
            Correo electrónico
          </label>
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="c.morales@taglmon.mx"
            class="w-full h-12 px-4 rounded-xl border-2 border-ink-100 bg-white text-ink text-base font-medium transition-colors focus:border-brand"
            autocapitalize="none"
            autocorrect="off"
            autocomplete="username"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-ink-400 uppercase tracking-wider mb-2">
            Contraseña
          </label>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              placeholder="••••••••"
              class="w-full h-12 px-4 pr-12 rounded-xl border-2 border-ink-100 bg-white text-ink text-base font-medium transition-colors focus:border-brand"
              autocomplete="current-password"
            />
            <button
              type="button"
              (click)="showPassword = !showPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 text-ink-300 hover:text-ink-400 transition-colors"
            >
              {{ showPassword ? 'Ocultar' : 'Ver' }}
            </button>
          </div>
        </div>

        @if (errorMessage()) {
          <p class="text-sm text-danger bg-danger-50 rounded-lg px-3 py-2">{{ errorMessage() }}</p>
        }

        <button
          type="submit"
          [disabled]="!email.trim() || !password.trim() || loading()"
          class="w-full h-14 rounded-xl bg-brand text-white text-base font-bold mt-1 disabled:opacity-40 transition-opacity active:scale-[0.98]"
        >
          {{ loading() ? 'Verificando...' : 'Ingresar' }}
        </button>
      </form>
    </div>

    <a
      routerLink="/admin/login"
      class="mt-6 block w-full text-center text-sm text-ink-300 hover:text-ink-400 transition-colors py-2"
    >
      Acceso de administrador
    </a>
  </div>
</div>
