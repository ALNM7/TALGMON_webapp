<div class="min-h-screen bg-ink-50 flex justify-center">
  <div class="w-full max-w-[430px] min-h-screen bg-white flex flex-col">
    <div class="px-6 pt-6 pb-4">
      <app-logo [heightPx]="24" />
    </div>

    <div class="flex-1 flex flex-col items-center justify-center px-8 text-center">
      <div class="w-24 h-24 rounded-full bg-ok-50 flex items-center justify-center mb-8" style="box-shadow: 0 0 0 12px #e6f4ed">
        <span class="text-4xl text-ok">✓</span>
      </div>

      <h1 class="text-2xl font-extrabold text-ink-700 mb-3">Orden enviada</h1>
      <p class="text-sm text-ink-300 leading-relaxed mb-8">
        La orden de servicio fue registrada exitosamente. El equipo administrativo la procesará en breve.
      </p>

      <div class="w-full bg-brand-50 rounded-2xl px-6 py-5 mb-10 border border-brand-100">
        <p class="text-xs font-semibold text-brand uppercase tracking-wider mb-2">Número de folio</p>
        <p class="font-mono text-2xl font-bold text-ink-700">{{ folio() || '...' }}</p>
        <p class="text-xs text-ink-300 mt-2">Conserva este número para seguimiento</p>
      </div>

      <div class="w-full flex flex-col gap-3">
        <a [href]="pdfUrl()" target="_blank"
          class="w-full h-14 rounded-xl border-2 border-brand text-brand text-base font-bold flex items-center justify-center gap-2 hover:bg-brand-50 transition-colors">
          Ver PDF de la orden
        </a>
        <a routerLink="/ingeniero/inicio" class="w-full h-14 rounded-xl bg-brand text-white text-base font-bold flex items-center justify-center">
          Volver al inicio
        </a>
      </div>
    </div>
  </div>
</div>
